<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Resistor</title>
  <script src="../ui/theme.js"></script>
  <link rel="stylesheet" href="../ui/app.css">
</head>
<body class="w-[21rem]">
  <div class="glow"></div>

  <div class="relative flex flex-col gap-3.5 p-4">

    <header class="flex items-center gap-2.5">
      <img src="../icons/icon48.png" alt="" width="26" height="26" class="size-6.5 flex-none">
      <strong class="flex-1 text-[0.9375rem] font-semibold tracking-tight">Resistor</strong>
      <span class="pill" id="streak" hidden>
        <!-- Heroicons: fire -->
        <svg class="ico-sm" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.362 5.214A8.252 8.252 0 0 1 12 21 8.25 8.25 0 0 1 6.038 7.047 8.287 8.287 0 0 0 9 9.601a8.983 8.983 0 0 1 3.361-6.867 8.21 8.21 0 0 0 3 2.48Z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 18a3.75 3.75 0 0 0 .495-7.468 5.99 5.99 0 0 0-1.925 3.547 5.975 5.975 0 0 1-2.133-1.001A3.75 3.75 0 0 0 12 18Z"/>
        </svg>
        <span id="streakText"></span>
      </span>
    </header>

    <div class="card grid grid-cols-2 divide-x divide-line">
      <div class="px-4 py-3.5">
        <p class="text-2xl font-bold tracking-tight" id="resists">0</p>
        <p class="eyebrow mt-0.5">Turned back</p>
      </div>
      <div class="px-4 py-3.5">
        <p class="text-2xl font-bold tracking-tight" id="budget">—</p>
        <p class="eyebrow mt-0.5">Minutes left</p>
      </div>
    </div>

    <button id="blockCurrent" class="btn btn-primary hidden w-full" type="button">
      <!-- Heroicons: plus -->
      <svg class="ico-sm" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
      </svg>
      <span id="blockCurrentLabel">Block this site</span>
    </button>
    <p class="text-[0.8125rem] text-muted empty:hidden" id="currentNote"></p>

    <section>
      <p class="eyebrow mb-2">Blocked sites</p>
      <ul class="flex max-h-56 flex-col gap-1.5 overflow-y-auto" id="sites"></ul>
      <p class="text-[0.8125rem] text-muted" id="empty" hidden>Nothing blocked yet.</p>
    </section>

    <button id="settings" class="btn btn-quiet w-full" type="button">
      <!-- Heroicons: cog-6-tooth -->
      <svg class="ico-sm" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
      </svg>
      Settings
    </button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
