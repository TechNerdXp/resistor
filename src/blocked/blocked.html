<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paused — Resistor</title>
  <script src="../ui/theme.js"></script>
  <link rel="stylesheet" href="../ui/app.css">
</head>
<body class="min-h-screen">
  <div class="glow"></div>

  <main class="relative mx-auto flex min-h-screen max-w-2xl flex-col justify-center px-6 py-14">

    <div class="mb-7 flex items-center justify-between gap-3">
      <span class="badge-ring size-11">
        <!-- Heroicons: hand-raised -->
        <svg class="ico" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.05 4.575a1.575 1.575 0 1 0-3.15 0v3m3.15-3v-1.5a1.575 1.575 0 0 1 3.15 0v1.5m-3.15 0 .075 5.925m3.075.75V4.575m0 0a1.575 1.575 0 0 1 3.15 0V15M6.9 7.575a1.575 1.575 0 1 0-3.15 0v8.175a6.75 6.75 0 0 0 6.75 6.75h2.018a5.25 5.25 0 0 0 3.712-1.538l1.732-1.732a5.25 5.25 0 0 0 1.538-3.712l.003-2.024a.668.668 0 0 1 .198-.471 1.575 1.575 0 1 0-2.228-2.228 3.818 3.818 0 0 0-1.12 2.687M6.9 7.575V12m6.27 4.318A4.49 4.49 0 0 1 16.35 15m.002 0h-.002"/>
        </svg>
      </span>

      <span class="pill" id="streakPill" hidden>
        <!-- Heroicons: fire -->
        <svg class="ico-sm" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.362 5.214A8.252 8.252 0 0 1 12 21 8.25 8.25 0 0 1 6.038 7.047 8.287 8.287 0 0 0 9 9.601a8.983 8.983 0 0 1 3.361-6.867 8.21 8.21 0 0 0 3 2.48Z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 18a3.75 3.75 0 0 0 .495-7.468 5.99 5.99 0 0 0-1.925 3.547 5.975 5.975 0 0 1-2.133-1.001A3.75 3.75 0 0 0 12 18Z"/>
        </svg>
        <span id="streakText"></span>
      </span>
    </div>

    <p class="eyebrow mb-2">Paused</p>
    <h1 class="text-balance text-4xl font-bold leading-[1.1] tracking-tight sm:text-5xl">
      A moment before
      <span class="text-gradient" id="host">this site</span>
    </h1>
    <p class="mt-3 max-w-lg text-pretty text-[0.9375rem] text-muted" id="context">
      You chose to put this site behind a moment of thought.
    </p>

    <div class="mt-8 flex flex-wrap gap-3">
      <button id="backBtn" class="btn btn-primary flex-1 basis-52" type="button">
        <!-- Heroicons: arrow-uturn-left -->
        <svg class="ico-sm" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3"/>
        </svg>
        Back to work
      </button>
      <button id="revealBtn" class="btn flex-1 basis-52" type="button">
        <!-- Heroicons: clock -->
        <svg class="ico-sm" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
        </svg>
        Let me in anyway
      </button>
    </div>

    <section id="gate" class="card mt-5 flex flex-col gap-3 p-5" hidden>
      <label class="label" for="reason" id="reasonLabel">What were you about to do?</label>
      <textarea id="reason" rows="2" class="input resize-y"
                placeholder="Be honest — one line is enough."
                autocomplete="off" spellcheck="false"></textarea>
      <p class="text-[0.8125rem] text-muted" id="gateHint"></p>
      <div class="flex flex-wrap gap-3 pt-1">
        <button id="proceedBtn" class="btn btn-primary" type="button" disabled>Continue</button>
        <button id="cancelBtn" class="btn btn-quiet" type="button">Never mind</button>
      </div>
      <p class="min-h-5 text-[0.8125rem] font-semibold text-danger" id="gateError" role="status" aria-live="polite"></p>
    </section>

    <section id="locked" class="card mt-5 flex items-start gap-4 p-5" hidden>
      <span class="badge-ring size-10">
        <!-- Heroicons: lock-closed -->
        <svg class="ico-sm" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/>
        </svg>
      </span>
      <div class="flex-1">
        <p class="text-[0.9375rem] font-semibold">This site is locked.</p>
        <p class="mt-1 text-pretty text-[0.875rem] text-muted">
          There is no way through until you change it in settings — which is the point.
        </p>
        <button id="lockedSettings" class="btn mt-3" type="button">Open settings</button>
      </div>
    </section>

    <footer class="mt-auto pt-12 text-[0.75rem] text-muted">
      <a class="hover:text-ink" href="https://technerdxp.github.io/resistor/" target="_blank" rel="noopener">Resistor</a>
      · built by
      <a class="hover:text-ink" href="https://technerdxp.github.io/resistor/" target="_blank" rel="noopener">TechNerdXp</a>
    </footer>
  </main>

  <script type="module" src="blocked.js"></script>
</body>
</html>
