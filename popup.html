<!DOCTYPE html>
<html>
<head>
  <title>Challenge Blocker</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
      padding: 20px;
      width: 300px;
      margin: 0;
      background: linear-gradient(135deg, #232526 0%, #414345 100%);
      color: white;
      text-align: center;
      border-radius: 10px;
    }
    .icon {
      width: 48px;
      height: 48px;
      margin-bottom: 15px;
    }
    h3 {
      font-size: 1.5em;
      font-weight: 700;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }
    p {
      font-size: 1.1em;
      margin-bottom: 20px;
      font-weight: 500;
    }
    button {
      padding: 12px 24px;
      font-size: 1.1em;
      border-radius: 8px;
      border: none;
      background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
    button:hover {
      background: linear-gradient(90deg, #0072ff 0%, #00c6ff 100%);
    }
  </style>
</head>
<body>
  <img src="icons/icon128.png" alt="Resistor Icon" class="icon">

  <p>Face a challenge to break through distractions.</p>

</html>
