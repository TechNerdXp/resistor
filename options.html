<!DOCTYPE html>
<html>
<head>
  <title>Settings</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
      padding: 20px;
      margin: 0;
      background: linear-gradient(135deg, #232526 0%, #414345 100%);
      color: white;
      text-align: center;
      min-height: 100vh;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
    }
    h2 {
      font-size: 2em;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    label {
      display: block;
      margin-bottom: 0px;
      font-weight: 500;
      font-size: 1.1em;
      text-align: left;
    }
    select {
      margin: 8px 0 20px 0;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.5);
      outline: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      background: rgba(100,100,100,0.8);
      color: #000;
      font-weight: 500;
      font-size: 1em;
      font-family: inherit;
      box-sizing: border-box;
    }
    input {
      margin: 8px 0 20px 0;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.5);
      outline: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      background: rgba(100,100,100,0.8);
      color: #fff;
      font-weight: 500;
      font-size: 1em;
      font-family: inherit;
      box-sizing: border-box;
    }
    textarea {
      margin: 8px 0 20px 0;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.5);
      outline: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      background: rgba(100,100,100,0.8);
      color: #fff;
      font-weight: 500;
      font-size: 1em;
      font-family: inherit;
      resize: vertical;
      box-sizing: border-box;
    }
    select option {
      background: rgba(100,100,100,0.9);
      color: #fff;
    }
    textarea::placeholder {
      color: rgba(255,255,255,0.7);
    }
    input::placeholder {
      color: rgba(255,255,255,0.7);
    }
    button {
      padding: 12px;
      font-size: 1.1em;
      border-radius: 8px;
      border: none;
      background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      width: 100%;
      box-sizing: border-box;
    }
    button:hover {
      background: linear-gradient(90deg, #0072ff 0%, #00c6ff 100%);
    }
    #status {
      margin-top: 15px;
      font-weight: 600;
      color: #00c6ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="icons/icon128.png" alt="Resistor Icon" class="icon">
    <h2>Settings</h2>
    <label>Blocked Sites (one per line):</label><br>
    <textarea id="sites" rows="5" placeholder="e.g., youtube.com&#10;facebook.com&#10;reddit.com"></textarea><br>
    <label>Redirect URL (for mindful pause):</label><br>
    <input id="redirectUrl" type="text" placeholder="e.g., https://www.upwork.com"><br>
    <label>Difficulty Level:</label><br>
    <select id="difficulty">
      <option value="easy" selected>Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select><br>
    <button id="save">Save</button>
    <div id="status"></div>
    <a href="https://x.com/technerdxp" target="_blank" style="display: block; margin-top: 20px; font-size: 0.9em; color: rgba(255,255,255,0.6); text-decoration: none; text-align: center;">@TechNerdXp</a>
  </div>
  <script src="options.js"></script>
</body>
</html>
