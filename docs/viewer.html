<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docs</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2937; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --code-bg: #f3f4f6; --side-bg: #f9fafb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827; --fg: #e5e7eb; --muted: #9ca3af; --line: #374151;
      --accent: #60a5fa; --code-bg: #1f2937; --side-bg: #0f172a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.7 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; min-height: 100vh;
  }
  nav {
    width: 250px; flex-shrink: 0; background: var(--side-bg);
    border-right: 1px solid var(--line); padding: 1.5rem 1rem;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  nav h1 { font-size: 1.05rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  #search {
    width: 100%; margin-top: .75rem; padding: .4rem .6rem;
    font: .85rem ui-sans-serif, system-ui, sans-serif;
    color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px;
  }
  #search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  #results a { display: block; }
  #results .snip {
    display: block; font-size: .72rem; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #results .none { font-size: .8rem; color: var(--muted); padding: .3rem .5rem; }
  nav .kicker {
    font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 1.25rem 0 .4rem; padding-left: .5rem;
  }
  nav a {
    display: flex; align-items: center; gap: .45rem;
    padding: .32rem .5rem; border-radius: 6px;
    color: var(--fg); text-decoration: none; font-size: .9rem;
  }
  nav a svg { width: .95rem; height: .95rem; flex: none; color: var(--muted); }
  nav a[aria-current="page"] svg { color: var(--accent); }
  nav a:hover { background: var(--code-bg); }
  nav a[aria-current="page"] {
    color: var(--accent); font-weight: 600;
    background: color-mix(in srgb, var(--accent) 10%, transparent);
  }
  nav .toc a { font-size: .8rem; color: var(--muted); padding: .18rem .5rem .18rem 1.3rem; }
  nav .toc a:hover { color: var(--fg); }
  main { flex: 1; max-width: 46rem; padding: 2.5rem 3rem 6rem; }
  main > h1:first-child { margin-top: 0; }
  main h1 { font-size: 1.9rem; letter-spacing: -.02em; line-height: 1.2; }
  main h2 {
    font-size: 1.3rem; letter-spacing: -.01em; line-height: 1.3;
    border-bottom: 1px solid var(--line); padding-bottom: .35rem; margin-top: 2.5rem;
  }
  main h3 { font-size: 1.05rem; line-height: 1.3; margin-top: 1.8rem; }
  main a { color: var(--accent); text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  main li { margin: .2rem 0; }
  blockquote {
    margin: 1rem 0; padding: .5rem 1rem; border-left: 3px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 5%, transparent);
    border-radius: 0 8px 8px 0; color: var(--muted);
  }
  blockquote p { margin: .25rem 0; }
  code { background: var(--code-bg); padding: .15em .35em; border-radius: 4px; font-size: .9em; }
  .codeblock { position: relative; margin: 1rem 0; }
  .codeblock pre {
    background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px;
    padding: .9rem 1rem; overflow-x: auto; margin: 0;
    font-size: .875rem; line-height: 1.6;
  }
  .codeblock pre code { background: none; padding: 0; }
  .lang {
    position: absolute; bottom: .45rem; right: .6rem; pointer-events: none;
    font: .68rem/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .05em;
    text-transform: uppercase; color: var(--muted); opacity: .8;
  }
  .copy-chip {
    position: absolute; top: .45rem; right: .45rem; cursor: pointer;
    display: inline-flex; align-items: center; gap: .3rem;
    font: .75rem ui-sans-serif, system-ui, sans-serif; color: var(--muted);
    background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
    padding: .2rem .6rem;
  }
  .copy-chip svg { width: .85rem; height: .85rem; }
  .copy-chip:hover, .copy-chip:focus-visible { color: var(--accent); border-color: var(--accent); }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
  th, td { border: 1px solid var(--line); padding: .4rem .6rem; text-align: left; }
  hr { border: none; border-top: 1px solid var(--line); margin: 2rem 0; }
  .err { color: var(--muted); font-style: italic; }
  .updated { font-size: .78rem; color: var(--muted); margin: 0 0 1rem; }
  @media (max-width: 720px) {
    body { flex-direction: column; }
    nav { width: 100%; height: auto; position: static; border-right: none; border-bottom: 1px solid var(--line); }
    main { padding: 1.25rem; }
  }
</style>
</head>
<body>
<nav aria-label="Documents"><h1 id="project-name">Docs</h1><input type="search" id="search" placeholder="Search docs…" aria-label="Search docs"><div id="results" hidden></div><div id="browse"><div class="kicker">Documents</div><div id="doclist"></div><div class="kicker">On this page</div><div class="toc" id="toc"></div></div></nav>
<main id="content" aria-live="polite"></main>
<script>
"use strict";
// Heroicons (MIT) outline paths, inlined so the file stays dependency-free.
const heroicon = (d, w = 1.8) =>
  `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="${w}" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="${d}"/></svg>`;
const NAV_ICONS = {
  home: heroicon("m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75"),
  wrench: heroicon("M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 1 1-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 0 0 4.486-6.336l-3.276 3.277a3.004 3.004 0 0 1-2.25-2.25l3.276-3.276a4.5 4.5 0 0 0-6.336 4.486c.091 1.076-.071 2.264-.904 2.95l-.102.085m-1.745 1.437L5.909 7.5H4.5L2.25 3.75l1.5-1.5L7.5 4.5v1.409l4.26 4.26m-1.745 1.437 1.745-1.437m6.615 8.206L15.75 15.75M4.867 19.125h.008v.008h-.008v-.008Z"),
  scale: heroicon("M12 3v17.25m0 0c-1.472 0-2.882.265-4.185.75M12 20.25c1.472 0 2.882.265 4.185.75M18.75 4.97A48.416 48.416 0 0 0 12 4.5c-2.291 0-4.545.16-6.75.47m13.5 0c1.01.143 2.01.317 3 .52m-3-.52 2.62 10.726c.122.499-.106 1.028-.589 1.202a5.988 5.988 0 0 1-2.031.352 5.988 5.988 0 0 1-2.031-.352c-.483-.174-.711-.703-.59-1.202L18.75 4.971Zm-16.5.52c.99-.203 1.99-.377 3-.52m0 0 2.62 10.726c.122.499-.106 1.028-.589 1.202a5.989 5.989 0 0 1-2.031.352 5.989 5.989 0 0 1-2.031-.352c-.483-.174-.711-.703-.59-1.202L5.25 4.971Z"),
  rocket: heroicon("M15.59 14.37a6 6 0 0 1-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 0 0 6.16-12.12A14.98 14.98 0 0 0 9.631 8.41m5.96 5.96a14.926 14.926 0 0 1-5.841 2.58m-.119-8.54a6 6 0 0 0-7.381 5.84h4.8m2.581-5.84a14.927 14.927 0 0 0-2.58 5.84m2.699 2.7c-.103.021-.207.041-.311.06a15.09 15.09 0 0 1-2.448-2.448 14.9 14.9 0 0 1 .06-.312m-2.24 2.39a4.493 4.493 0 0 0-1.757 4.306 4.493 4.493 0 0 0 4.306-1.758M16.5 9a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z"),
  book: heroicon("M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25"),
  grid: heroicon("M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z"),
  pencil: heroicon("m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"),
  doc: heroicon("M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"),
};

// Curated docs get labels + icons; anything else in docs/*.md is auto-discovered
// from the server's directory listing, so new docs never go invisible.
const DOCS = [
  ["README", "../README.md", "home"],
  ["Setup", "setup.md", "wrench"],
  ["Decisions", "decisions.md", "scale"],
  ["Deploy", "deploy.md", "rocket"],
  ["Sheet", "sheet.md", "grid"],
  ["Vocab", "vocab.md", "book"],
  ["Scratchpad", "../scratchpad.md", "pencil"],
];

// Heroicons (MIT) — clipboard + check, inlined so the file stays dependency-free.
const ICON_COPY = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75h-6a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184"/></svg>';
const ICON_CHECK = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>';

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
}

// Minimal markdown -> HTML: headings, fenced code, lists, quotes, tables, hr.
function render(md) {
  const out = [];
  const lines = md.split(/\r?\n/);
  let i = 0, list = null;
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  while (i < lines.length) {
    const l = lines[i];
    if (l.startsWith("```")) {
      closeList();
      const lang = l.slice(3).trim();
      const buf = [];
      for (i++; i < lines.length && !lines[i].startsWith("```"); i++) buf.push(lines[i]);
      i++;
      const badge = lang ? `<span class="lang">${esc(lang)}</span>` : "";
      out.push(`<div class="codeblock"><button class="copy-chip" type="button" aria-label="Copy code">${ICON_COPY}<span>Copy</span></button><pre><code>${esc(buf.join("\n"))}</code></pre>${badge}</div>`);
      continue;
    }
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)/))) { closeList(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); }
    else if (/^(-{3,}|\*{3,})\s*$/.test(l)) { closeList(); out.push("<hr>"); }
    else if ((m = l.match(/^>\s?(.*)/))) { closeList(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); }
    else if ((m = l.match(/^[-*]\s+(.*)/))) { if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); }
    else if ((m = l.match(/^\d+\.\s+(.*)/))) { if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); }
    else if (l.includes("|") && lines[i + 1] && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
      closeList();
      const cells = r => r.split("|").map(c => c.trim()).filter((c, k, a) => k > 0 || c !== "").filter((c, k, a) => k < a.length - 1 || c !== "");
      out.push("<table><thead><tr>" + cells(l).map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>");
      for (i += 2; i < lines.length && lines[i].includes("|"); i++)
        out.push("<tr>" + cells(lines[i]).map(c => `<td>${inline(c)}</td>`).join("") + "</tr>");
      out.push("</tbody></table>");
      continue;
    }
    else if (l.trim() === "") closeList();
    else out.push(`<p>${inline(l)}</p>`);
    i++;
  }
  closeList();
  return out.join("\n");
}

async function show(path, link) {
  const main = document.getElementById("content");
  try {
    const r = await fetch(path);
    if (!r.ok) throw new Error(r.status);
    main.innerHTML = render(await r.text());
    // Per-doc "last updated", straight from the file's Last-Modified header.
    const mod = r.headers.get("last-modified");
    if (mod) {
      const p = document.createElement("p");
      p.className = "updated";
      p.textContent = "Last updated " + new Date(mod).toLocaleString(undefined,
        { dateStyle: "medium", timeStyle: "short" });
      main.prepend(p);
    }
  } catch {
    main.innerHTML = `<p class="err">Could not load ${esc(path)} — serve the project root (kicker docs, or Live Server) rather than opening this file directly.</p>`;
  }
  document.querySelectorAll("#doclist a").forEach(a => a.removeAttribute("aria-current"));
  if (link) link.setAttribute("aria-current", "page");
  // Rebuild the "On this page" TOC from the rendered h2s.
  const toc = document.getElementById("toc");
  toc.innerHTML = "";
  main.querySelectorAll("h2").forEach((h, k) => {
    h.id = "s" + k;
    const a = document.createElement("a");
    a.textContent = h.textContent;
    a.href = "#s" + k;
    toc.appendChild(a);
  });
  toc.previousElementSibling.style.display = toc.children.length ? "" : "none";
  main.scrollIntoView(true);
}

const available = [];   // docs that exist: {label, path, a}

// Auto-discover docs/*.md from the server's directory listing (python
// http.server and Live Server both provide one), so docs created after
// scaffold time show up without editing this file.
async function discoverDocs() {
  const known = new Set(DOCS.map(([, p]) => p));
  const extras = [];
  try {
    const html = await (await fetch("./")).text();
    for (const m of html.matchAll(/href="([^"?#]+\.md)"/gi)) {
      const file = decodeURIComponent(m[1]).split("/").pop();
      if (known.has(file) || extras.some(e => e[1] === file)) continue;
      const label = file.replace(/\.md$/i, "").replace(/[-_]+/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
      extras.push([label, file, "doc"]);
    }
  } catch {}
  extras.sort((x, y) => x[0].localeCompare(y[0]));
  return extras;
}

async function init() {
  const nav = document.getElementById("doclist");
  let first = null;
  for (const [label, path, ic] of [...DOCS, ...await discoverDocs()]) {
    try {
      if (!(await fetch(path, { method: "HEAD" })).ok) continue;
    } catch { continue; }
    const a = document.createElement("a");
    a.innerHTML = (NAV_ICONS[ic] || "") + `<span></span>`;
    a.lastElementChild.textContent = label;
    a.href = "#" + label.toLowerCase();
    a.addEventListener("click", e => { e.preventDefault(); show(path, a); });
    nav.appendChild(a);
    available.push({ label, path, a });
    first = first || (() => show(path, a));
  }
  if (first) first();
  else show(DOCS[0][1], null);
  // Name the sidebar (and the tab) after the project: the README's h1.
  try {
    const md = await (await fetch("../README.md")).text();
    const m = md.match(/^#\s+(.+)/m);
    if (m) {
      document.getElementById("project-name").textContent = m[1];
      document.title = m[1] + " — docs";
    }
  } catch {}
}

// Client-side search: fetches the docs fresh on each query (they're tiny),
// so results never lag behind edits.
async function search(q) {
  const results = document.getElementById("results");
  const browse = document.getElementById("browse");
  if (!q.trim()) { results.hidden = true; browse.hidden = false; return; }
  results.hidden = false; browse.hidden = true;
  results.innerHTML = "";
  const needle = q.toLowerCase();
  for (const doc of available) {
    let text;
    try { text = await (await fetch(doc.path)).text(); } catch { continue; }
    const at = text.toLowerCase().indexOf(needle);
    if (at < 0) continue;
    const a = document.createElement("a");
    a.href = "#" + doc.label.toLowerCase();
    const snip = text.slice(Math.max(0, at - 30), at + needle.length + 40).replace(/\s+/g, " ");
    a.innerHTML = `<span></span><span class="snip"></span>`;
    a.firstElementChild.textContent = doc.label;
    a.lastElementChild.textContent = "…" + snip + "…";
    a.addEventListener("click", e => {
      e.preventDefault();
      document.getElementById("search").value = "";
      search("");
      show(doc.path, doc.a);
    });
    results.appendChild(a);
  }
  if (!results.children.length) results.innerHTML = '<p class="none">No matches.</p>';
}

let debounce;
document.getElementById("search").addEventListener("input", e => {
  clearTimeout(debounce);
  debounce = setTimeout(() => search(e.target.value), 150);
});

document.addEventListener("click", async e => {
  const chip = e.target.closest(".copy-chip");
  if (!chip) return;
  await navigator.clipboard.writeText(chip.nextElementSibling.textContent);
  chip.innerHTML = ICON_CHECK + "<span>Copied!</span>";
  setTimeout(() => { chip.innerHTML = ICON_COPY + "<span>Copy</span>"; }, 1500);
});

init();
</script>
</body>
</html>
